# .github/workflows/ci.yml

# 工作流名称
name: Python Project CI

# 触发工作流的事件：当有代码推送到 main 分支或有人向 main 分支发起 Pull Request 时触发
on:
  push:
    branches: [ integrate ]  # 触发事件的分支，通常是 main 或 master, 但这里是integrate
  pull_request:
    branches: [ integrate ]

# 工作流包含的任务 (jobs)
jobs:
  build-and-test:
    # 运行此任务的操作系统环境
    runs-on: ubuntu-latest

    # 任务包含的步骤 (steps)
    steps:
    # 第一步：检出你的代码库
    - name: Checkout repository
      uses: actions/checkout@v4

    # 第二步：设置Python环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # 使用与你本地环境匹配的 Python 版本，或者选择一个稳定的版本如 '3.11'

    # 第三步：安装项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt
        pip install Flask
        pip install SQLAlchemy
        pip install pytest
        pip install pytest-cov
        pip install flask_sqlalchemy

    # 第四步：运行单元测试
    # 使用 pytest 运行 testFolder/ 目录下的所有测试
    - name: Run tests with pytest
      run: |
        pytest intergrate_test/ -v # -v 参数提供详细输出，方便调试
